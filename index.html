<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pengingat Dokumen</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
    color: #2b2a27;
    background: #faf9f6;
    margin: 0;
    padding: 24px 16px 60px;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 22px; font-weight: 700; margin: 0; letter-spacing: -0.01em; }
  .subtitle { font-size: 14px; color: #79766f; margin: 4px 0 0; }
  .badge-warning {
    font-size: 11px; color: #b3852f; margin: 6px 0 0; background: #fdf5e6;
    display: inline-block; padding: 3px 8px; border-radius: 6px;
  }
  .error-box {
    background: #fdecec; border: 1px solid #e5b5b3; color: #7a2620;
    font-size: 13px; padding: 8px 12px; border-radius: 8px; margin-bottom: 16px; display: none;
  }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 20px 0; }
  .stat-card {
    cursor: pointer; border-radius: 10px; padding: 10px; text-align: center; border: 1px solid;
  }
  .stat-value { font-size: 20px; font-weight: 700; }
  .stat-label { font-size: 11px; margin-top: 2px; }
  .controls { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  input[type="text"], input[type="date"], select {
    padding: 8px 10px; border-radius: 8px; border: 1px solid #d8d5cd; font-size: 13px; font-family: inherit;
  }
  #searchInput { flex: 1 1 160px; }
  .btn-primary {
    padding: 8px 14px; border-radius: 8px; border: none; background: #2b2a27;
    color: #fff; font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .clear-filter {
    font-size: 12px; color: #79766f; background: none; border: none; cursor: pointer;
    padding: 0; text-decoration: underline; margin-bottom: 12px; display: none;
  }
  .empty-state {
    text-align: center; padding: 40px 16px; color: #9a9790; font-size: 14px;
    border: 1px dashed #d8d5cd; border-radius: 12px;
  }
  .doc-list { display: flex; flex-direction: column; gap: 8px; }
  .doc-card {
    background: #fff; border-radius: 10px; padding: 12px 14px;
    display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;
    border: 1px solid; border-left-width: 4px;
  }
  .doc-name { font-weight: 600; font-size: 14px; }
  .doc-cat { font-size: 11px; color: #8a8781; background: #f1efe8; padding: 1px 8px; border-radius: 999px; margin-left: 8px; }
  .doc-date { font-size: 12px; color: #79766f; margin-top: 4px; }
  .doc-note { font-size: 12px; color: #9a9790; margin-top: 2px; }
  .doc-status { display: inline-block; margin-top: 6px; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; }
  .doc-actions { display: flex; gap: 6px; flex-shrink: 0; }
  .btn-sm {
    font-size: 12px; padding: 5px 10px; border-radius: 6px; border: 1px solid #d8d5cd;
    background: #fff; cursor: pointer;
  }
  .btn-danger { border-color: #e5b5b3; color: #a3372f; }
  .modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.35);
    align-items: center; justify-content: center; padding: 16px; z-index: 50;
  }
  .modal-overlay.active { display: flex; }
  .modal-box {
    background: #fff; border-radius: 14px; padding: 20px; width: 100%; max-width: 380px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.15);
  }
  .modal-box h2 { font-size: 16px; font-weight: 700; margin: 0 0 14px; }
  .field-label { font-size: 12px; color: #79766f; display: block; margin-bottom: 4px; }
  .field-input { width: 100%; margin-bottom: 12px; }
  .form-error { color: #a3372f; font-size: 12px; margin-bottom: 8px; display: none; }
  .modal-actions { display: flex; gap: 8px; margin-top: 12px; }
  .modal-actions button { flex: 1; padding: 9px 0; border-radius: 8px; font-size: 13px; cursor: pointer; }
  .btn-cancel { border: 1px solid #d8d5cd; background: #fff; }
  .btn-submit { border: none; background: #2b2a27; color: #fff; font-weight: 600; }
  footer.note { font-size: 11px; color: #b0ada4; text-align: center; margin-top: 32px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Pengingat Dokumen</h1>
    <p class="subtitle">Pantau tanggal expired KTP, paspor, kontrak, dan dokumen penting lainnya.</p>
    <p class="badge-warning">⚠ Data shared real-time — semua orang yang buka situs ini melihat & bisa mengubah daftar yang sama.</p>
  </header>

  <div class="error-box" id="errorBox"></div>

  <div class="stats" id="statsGrid"></div>

  <div class="controls">
    <input type="text" id="searchInput" placeholder="Cari nama dokumen…" />
    <select id="categoryFilter"></select>
    <button class="btn-primary" id="addBtn">+ Tambah dokumen</button>
  </div>

  <button class="clear-filter" id="clearFilterBtn">Hapus filter status ✕</button>

  <div id="listContainer"></div>

  <footer class="note">Dibuat dengan Claude · data tersimpan lokal di browser ini</footer>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box" onclick="event.stopPropagation()">
    <h2 id="modalTitle">Tambah dokumen</h2>
    <label class="field-label">Nama dokumen</label>
    <input type="text" id="formNama" class="field-input" placeholder="cth. Paspor - Budi" />
    <label class="field-label">Kategori</label>
    <select id="formKategori" class="field-input"></select>
    <label class="field-label">Tanggal expired</label>
    <input type="date" id="formTanggal" class="field-input" />
    <label class="field-label">Catatan (opsional)</label>
    <input type="text" id="formCatatan" class="field-input" placeholder="cth. Perpanjang di kantor imigrasi" />
    <div class="form-error" id="formError"></div>
    <div class="modal-actions">
      <button class="btn-cancel" id="cancelBtn">Batal</button>
      <button class="btn-submit" id="submitBtn">Tambah</button>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyAG-N1ywyQeuDXsOnv8ZFOJkJTkCGmz8xg",
  authDomain: "dokumen-tracker-grp.firebaseapp.com",
  projectId: "dokumen-tracker-grp",
  storageBucket: "dokumen-tracker-grp.firebasestorage.app",
  messagingSenderId: "59684390161",
  appId: "1:59684390161:web:04491a24d06eab7d2878b0",
  measurementId: "G-SKDPPFPT94"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const docRef = db.collection("dokumen_tracker").doc("shared_list");

const CATEGORIES = ["KTP","Paspor","SIM","STNK","BPKB","Kontrak","Sertifikat","Izin Usaha","Asuransi","Visa","Lainnya"];

const STATUS_STYLES = {
  expired: { bg: "#fdecec", border: "#e5b5b3", text: "#7a2620", dot: "#b6392f", label: "Kadaluarsa" },
  urgent:  { bg: "#fdf1e2", border: "#e8c893", text: "#7a4e12", dot: "#c17d1f", label: "Segera habis" },
  soon:    { bg: "#fdf8e2", border: "#e3d38f", text: "#6b5e14", dot: "#b39a1f", label: "Mendekati" },
  safe:    { bg: "#eaf2ec", border: "#a9c9b0", text: "#265234", dot: "#3f7d54", label: "Aktif" },
};

let docs = [];
let filterStatus = "all";
let filterCategory = "all";
let query = "";
let editingId = null;

let unsubscribe = null;

function loadDocs() {
  unsubscribe = docRef.onSnapshot(
    (snap) => {
      const data = snap.exists ? snap.data() : null;
      docs = data && Array.isArray(data.items) ? data.items : [];
      hideError();
      renderAll();
    },
    (err) => {
      console.error(err);
      showError("Gagal terhubung ke database. Cek koneksi internet atau konfigurasi Firebase.");
    }
  );
}

async function saveDocs() {
  try {
    await docRef.set({ items: docs, updatedAt: new Date().toISOString() });
    hideError();
  } catch (e) {
    console.error(e);
    showError("Gagal menyimpan ke database. Coba lagi.");
  }
}

function showError(msg) {
  const box = document.getElementById("errorBox");
  box.textContent = msg;
  box.style.display = "block";
}
function hideError() {
  document.getElementById("errorBox").style.display = "none";
}

function daysUntil(dateStr) {
  const today = new Date();
  today.setHours(0,0,0,0);
  const target = new Date(dateStr + "T00:00:00");
  return Math.round((target - today) / 86400000);
}

function getStatus(dateStr) {
  const d = daysUntil(dateStr);
  if (d < 0) return { key: "expired", days: d };
  if (d <= 30) return { key: "urgent", days: d };
  if (d <= 90) return { key: "soon", days: d };
  return { key: "safe", days: d };
}

function formatDate(dateStr) {
  const d = new Date(dateStr + "T00:00:00");
  return d.toLocaleDateString("id-ID", { day: "numeric", month: "long", year: "numeric" });
}

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

function populateCategorySelects() {
  const filterSel = document.getElementById("categoryFilter");
  filterSel.innerHTML = '<option value="all">Semua kategori</option>' +
    CATEGORIES.map(c => `<option value="${c}">${c}</option>`).join("");

  const formSel = document.getElementById("formKategori");
  formSel.innerHTML = CATEGORIES.map(c => `<option value="${c}">${c}</option>`).join("");
}

function renderStats() {
  const s = { total: docs.length, expired: 0, urgent: 0, soon: 0, safe: 0 };
  docs.forEach(d => { s[getStatus(d.tanggal).key]++; });

  const items = [
    { key: "expired", label: "Kadaluarsa", value: s.expired },
    { key: "urgent", label: "Segera habis", value: s.urgent },
    { key: "soon", label: "Mendekati", value: s.soon },
    { key: "safe", label: "Aktif", value: s.safe },
  ];

  const grid = document.getElementById("statsGrid");
  grid.innerHTML = items.map(it => {
    const st = STATUS_STYLES[it.key];
    const active = filterStatus === it.key;
    return `<div class="stat-card" data-status="${it.key}"
        style="background:${st.bg};border-color:${active ? st.dot : st.border};">
      <div class="stat-value" style="color:${st.text}">${it.value}</div>
      <div class="stat-label" style="color:${st.text}">${it.label}</div>
    </div>`;
  }).join("");

  grid.querySelectorAll(".stat-card").forEach(card => {
    card.addEventListener("click", () => {
      const key = card.dataset.status;
      filterStatus = filterStatus === key ? "all" : key;
      renderAll();
    });
  });
}

function renderList() {
  const container = document.getElementById("listContainer");
  const filtered = docs
    .filter(d => filterStatus === "all" || getStatus(d.tanggal).key === filterStatus)
    .filter(d => filterCategory === "all" || d.kategori === filterCategory)
    .filter(d => d.nama.toLowerCase().includes(query.toLowerCase()))
    .sort((a, b) => daysUntil(a.tanggal) - daysUntil(b.tanggal));

  document.getElementById("clearFilterBtn").style.display = filterStatus !== "all" ? "block" : "none";

  if (filtered.length === 0) {
    container.innerHTML = `<div class="empty-state">${
      docs.length === 0
        ? 'Belum ada dokumen tersimpan. Klik "Tambah dokumen" untuk mulai.'
        : 'Tidak ada dokumen yang cocok dengan filter.'
    }</div>`;
    return;
  }

  container.innerHTML = `<div class="doc-list">${filtered.map(d => {
    const st = getStatus(d.tanggal);
    const styles = STATUS_STYLES[st.key];
    const daysLabel = st.days < 0 ? `Lewat ${Math.abs(st.days)} hari` : st.days === 0 ? "Hari ini" : `${st.days} hari lagi`;
    return `<div class="doc-card" style="border-color:${styles.border};border-left-color:${styles.dot}">
      <div style="min-width:0">
        <div><span class="doc-name">${escapeHtml(d.nama)}</span><span class="doc-cat">${escapeHtml(d.kategori)}</span></div>
        <div class="doc-date">Expired: ${formatDate(d.tanggal)}</div>
        ${d.catatan ? `<div class="doc-note">${escapeHtml(d.catatan)}</div>` : ""}
        <div class="doc-status" style="color:${styles.text};background:${styles.bg}">${styles.label} · ${daysLabel}</div>
      </div>
      <div class="doc-actions">
        <button class="btn-sm" onclick="openEdit('${d.id}')">Edit</button>
        <button class="btn-sm btn-danger" onclick="deleteDoc('${d.id}')">Hapus</button>
      </div>
    </div>`;
  }).join("")}</div>`;
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

function renderAll() {
  renderStats();
  renderList();
}

function openAdd() {
  editingId = null;
  document.getElementById("modalTitle").textContent = "Tambah dokumen";
  document.getElementById("submitBtn").textContent = "Tambah";
  document.getElementById("formNama").value = "";
  document.getElementById("formKategori").value = CATEGORIES[0];
  document.getElementById("formTanggal").value = "";
  document.getElementById("formCatatan").value = "";
  document.getElementById("formError").style.display = "none";
  document.getElementById("modalOverlay").classList.add("active");
}

function openEdit(id) {
  const doc = docs.find(d => d.id === id);
  if (!doc) return;
  editingId = id;
  document.getElementById("modalTitle").textContent = "Edit dokumen";
  document.getElementById("submitBtn").textContent = "Simpan";
  document.getElementById("formNama").value = doc.nama;
  document.getElementById("formKategori").value = doc.kategori;
  document.getElementById("formTanggal").value = doc.tanggal;
  document.getElementById("formCatatan").value = doc.catatan || "";
  document.getElementById("formError").style.display = "none";
  document.getElementById("modalOverlay").classList.add("active");
}

function closeModal() {
  document.getElementById("modalOverlay").classList.remove("active");
  editingId = null;
}

function submitForm() {
  const nama = document.getElementById("formNama").value.trim();
  const kategori = document.getElementById("formKategori").value;
  const tanggal = document.getElementById("formTanggal").value;
  const catatan = document.getElementById("formCatatan").value.trim();
  const errBox = document.getElementById("formError");

  if (!nama) { errBox.textContent = "Isi nama dokumen dulu."; errBox.style.display = "block"; return; }
  if (!tanggal) { errBox.textContent = "Pilih tanggal expired dulu."; errBox.style.display = "block"; return; }

  if (editingId) {
    const idx = docs.findIndex(d => d.id === editingId);
    if (idx > -1) docs[idx] = { ...docs[idx], nama, kategori, tanggal, catatan };
  } else {
    docs.push({ id: uid(), nama, kategori, tanggal, catatan });
  }
  saveDocs();
  closeModal();
  renderAll();
}

function deleteDoc(id) {
  docs = docs.filter(d => d.id !== id);
  saveDocs();
  renderAll();
}
window.openEdit = openEdit;
window.deleteDoc = deleteDoc;

document.getElementById("addBtn").addEventListener("click", openAdd);
document.getElementById("cancelBtn").addEventListener("click", closeModal);
document.getElementById("submitBtn").addEventListener("click", submitForm);
document.getElementById("modalOverlay").addEventListener("click", closeModal);
document.getElementById("clearFilterBtn").addEventListener("click", () => { filterStatus = "all"; renderAll(); });
document.getElementById("searchInput").addEventListener("input", (e) => { query = e.target.value; renderList(); });
document.getElementById("categoryFilter").addEventListener("change", (e) => { filterCategory = e.target.value; renderList(); });

populateCategorySelects();
loadDocs();
</script>
</body>
</html>
